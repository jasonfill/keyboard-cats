name: Deploy to GitHub Pages

# Manual only, deliberately.
#
# The SPA now gets all of its data from the API at /api on the same origin.
# GitHub Pages serves static files and nothing else, so a Pages build of this
# app would load, show a sign-in screen, and then fail every request. Deployment
# moved to DigitalOcean App Platform (see .do/app.yaml), which serves the SPA
# and the API together under one hostname.
#
# This workflow is kept, rather than deleted, so the last static-only build can
# still be produced by hand if the DO app has to be rolled back to it.
on:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:words
      - run: npm run simulate:adaptive
      # Workspaces: shared must be built before the web app can resolve it.
      - run: npm run build --workspace @whizzo/shared
      - run: npm run build --workspace @whizzo/web
        env:
          # Optional. Without them the deployed build runs in guest mode
          # (localStorage only) rather than failing. Both are public values —
          # the anon key is only useful through Row Level Security.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
